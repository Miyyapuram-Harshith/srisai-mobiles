name = "srisai-mobiles"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

main = "dist/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "srisai_db_dev"
database_id = "ac376cb7-7552-4f1f-8291-8e943ee5255b"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "srisai-storage-dev"

[vars]
ENVIRONMENT = "production"
RAZORPAY_MODE = "TEST"
